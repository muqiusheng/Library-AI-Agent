name: bookpath-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookpath
      POSTGRES_USER: bookpath
      POSTGRES_PASSWORD: bookpath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookpath -d bookpath"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1536m

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bookpath:bookpath@postgres:5432/bookpath
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "4173:5173"
    depends_on:
      - backend
    mem_limit: 1g

volumes:
  postgres_data:
  chroma_data:
