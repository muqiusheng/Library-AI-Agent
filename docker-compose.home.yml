name: bookpath-home

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.home
    volumes:
      - postgres_home_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 1536m
    logging: *default-logging
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.home
    volumes:
      - chroma_home_data:/app/data/chroma
      - uploads_home_data:/app/data/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3));
          raise SystemExit(0 if data['data']['status']=='ok' else 1)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging
    networks: [internal]

  gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile.home
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:8180:80"
    volumes:
      - ./frontend/nginx.home.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    networks: [internal]

volumes:
  postgres_home_data:
  chroma_home_data:
  uploads_home_data:

networks:
  internal:
    driver: bridge
