name: bookpath-instabox

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.instabox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 1536m
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env.instabox
    volumes:
      - chroma_data:/app/data/chroma
      - uploads_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3));
          raise SystemExit(0 if data['data']['status']=='ok' else 1)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    logging: *default-logging

  gateway:
    build:
      context: ./frontend
      dockerfile: Dockerfile.home
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "127.0.0.1:8180:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

volumes:
  postgres_data:
  chroma_data:
    name: bookpath-instabox_chroma_migrated_20261124_083801
  uploads_data:
    name: bookpath-instabox_uploads_migrated_20261124_083801
